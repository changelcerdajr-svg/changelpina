<title>CRAPPY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: una poza de marea. Arriba el cangrejo trabajando entre tres puestos; debajo, sus numeros. */
:root {
  --bg: #e9f1f0; --surface: #f7fbfa; --ink: #12262d; --muted: #577079; --line: #c9d9d8;
  --crab: #d9603b; --crab-dark: #9c3b20; --sand: #dcc9a3; --water: #bfe0de;
  --good: #1d7a54; --bad: #b3261e; --hot: #6a3fd0;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b171c; --surface: #12232a; --ink: #e4efee; --muted: #8aa4ab; --line: #24404a;
  --crab: #f07a52; --crab-dark: #b24a2a; --sand: #4a4130; --water: #173b44;
  --good: #57c795; --bad: #ff8a80; --hot: #ac90ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b171c; --surface: #12232a; --ink: #e4efee; --muted: #8aa4ab; --line: #24404a;
  --crab: #f07a52; --crab-dark: #b24a2a; --sand: #4a4130; --water: #173b44;
  --good: #57c795; --bad: #ff8a80; --hot: #ac90ff; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { --me: var(--crab); max-width: 920px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
.wrap[data-p="agresivo"] { --me: var(--hot); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 5vw, 34px); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
.top p { margin: 0; color: var(--muted); font-size: 13px; }
.tag { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); padding: 2px 8px; border-radius: 3px; color: var(--muted); white-space: nowrap; }

/* escena */
.stage { background: var(--water); border: 2px solid var(--ink); position: relative; overflow: hidden; }
.stations { display: grid; grid-template-columns: repeat(3, 1fr); }
.station { padding: 14px 8px 0; text-align: center; min-width: 0; }
.station + .station { border-left: 2px dashed color-mix(in srgb, var(--ink) 25%, transparent); }
.station b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(10px, 2.6vw, 13px); letter-spacing: .06em; }
.station span { font-family: var(--mono); font-size: clamp(20px, 5vw, 30px); font-weight: 500; font-variant-numeric: tabular-nums; }
.station.on b { color: var(--me); }
.floor { height: 84px; position: relative; }
.floor::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: var(--sand); border-top: 2px solid var(--ink); }
#crab { position: absolute; bottom: 12px; left: 16.66%; width: 100px; height: 60px; margin-left: -50px; image-rendering: pixelated; z-index: 1;
  transition: left 1s steps(10); }
.pop { position: absolute; bottom: 70px; font-family: var(--display); font-size: 14px; z-index: 2; pointer-events: none; animation: rise 1.6s ease-out forwards; transform: translateX(-50%); white-space: nowrap; }
.pop.good { color: var(--good); } .pop.bad { color: var(--bad); }
@keyframes rise { from { opacity: 1; margin-bottom: 0 } to { opacity: 0; margin-bottom: 34px } }
.say { border-top: 2px solid var(--ink); background: var(--surface); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-height: 74px; }
.say .txt { flex: 1 1 260px; min-width: 0; }
.say .what { font-weight: 600; }
.say .q { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.say .when { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
button { font: inherit; font-family: var(--display); font-size: 11px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); padding: 6px 10px; cursor: pointer; }
button:hover { background: var(--ink); color: var(--surface); }
button.tab[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tabs { display: flex; }
.tabs .tab + .tab { border-left: 0; }
.cmp td, .cmp th { padding-right: 14px; }
.cmp td.n, .cmp th.n { padding-left: 0; padding-right: 14px; }
.dot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; }
button:focus-visible { outline: 3px solid var(--crab); outline-offset: 2px; }

/* numeros */
.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); background: var(--surface); }
.num { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.num small { display: block; color: var(--muted); font-size: 12.5px; }
.num strong { font-family: var(--mono); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; }
.num em { font-style: normal; font-family: var(--mono); font-size: 12.5px; color: var(--muted); display: block; }
.good { color: var(--good); } .bad { color: var(--bad); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; }
.two > * { min-width: 0; }
svg { display: block; width: 100%; height: auto; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.note { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; max-width: 65ch; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 0; padding-left: 10px; }
td.m { overflow-wrap: anywhere; min-width: 150px; }
.pill { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); font-size: 13.5px; }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { #crab { transition: none } .pop { animation: none; opacity: 1 } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>CRAPPY</h1>
      <p>Un cangrejo pirata que compra resultados casi seguros en Polymarket. Dinero de mentira, mercados de verdad.</p>
    </div>
    <span class="tag" id="updated"></span>
  </header>

  <div class="top">
    <div class="tabs" role="group" aria-label="Perfil">
      <button class="tab" id="tab-base" type="button" aria-pressed="true">Base</button>
      <button class="tab" id="tab-agresivo" type="button" aria-pressed="false">Agresivo</button>
    </div>
    <p id="pdesc"></p>
  </div>

  <section class="stage" aria-label="El cangrejo repasando sus últimas jugadas">
    <div class="stations">
      <div class="station" id="st0"><b>Órdenes</b><span id="c0"></span></div>
      <div class="station" id="st1"><b>Posiciones</b><span id="c1"></span></div>
      <div class="station" id="st2"><b>Cobradas</b><span id="c2"></span></div>
    </div>
    <div class="floor"><canvas id="crab" width="20" height="12"></canvas></div>
    <div class="say">
      <div class="txt"><div class="what" id="what"></div><div class="q" id="q"></div></div>
      <div class="when" id="when"></div>
      <button id="pause" type="button" aria-pressed="false">Pausa</button>
    </div>
  </section>

  <section>
    <div class="nums" id="nums"></div>
  </section>

  <section>
    <h2>Base contra agresivo</h2>
    <div class="scroll" id="cmp"></div>
  </section>

  <section class="two">
    <div>
      <h2>Valor de la cartera</h2>
      <svg id="eq" viewBox="0 0 420 170" role="img" aria-label="Valor de la cartera en cada corrida"></svg>
    </div>
    <div>
      <h2>¿Hay ventaja de verdad?</h2>
      <svg id="edge" viewBox="0 0 420 96" role="img" aria-label="Ventaja medida en el registro sombra"></svg>
      <p class="note" id="edgenote"></p>
    </div>
  </section>

  <section class="two">
    <div>
      <h2>Lo que tiene ahora</h2>
      <div class="scroll" id="open"></div>
    </div>
    <div>
      <h2>Últimas cobradas</h2>
      <div class="scroll" id="closed"></div>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const ALL = __DATA__;
let D = ALL.profiles.base, KEY = "base";
const WRAP = document.querySelector(".wrap");
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(WRAP).getPropertyValue(n).trim();
const money = (v, sign) => (sign && v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("es-MX", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cents = p => (p * 100).toFixed(1) + "c";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const when = t => new Date(t).toLocaleString("es-MX", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
const RULE = {cripto_cierre: "cripto", deportes_previo: "deportes", otros_cierre: "otros", clima_cierre: "clima", post_fin_95_97: "fin pasado", post_fin_90_97: "fin pasado"};
const DESC = {base: "Las reglas del plan: $50 por jugada, favoritos de 97c o más, puja al precio medio.", agresivo: "Experimento: $100 por jugada, favoritos desde 95c, más categorías y puja más alto para que le llenen."};
const PCOL = {base: "--crab", agresivo: "--hot"};

function render() {
$("updated").textContent = "Actualizado " + when(ALL.updated);
$("pdesc").textContent = DESC[KEY];
$("c0").textContent = D.n_orders; $("c1").textContent = D.n_pos; $("c2").textContent = D.n_closed;

/* ---- numeros ---- */
const pnl = D.equity - D.capital0;
$("nums").innerHTML = [
  ["Valor de la cartera", money(D.equity), "empezó con " + money(D.capital0), ""],
  ["Ganancia o pérdida", money(pnl, true), (pnl >= 0 ? "+" : "−") + Math.abs(pnl / D.capital0 * 100).toFixed(2) + "%", pnl >= 0 ? "good" : "bad"],
  ["Operaciones cobradas", D.n_closed, D.wins + " ganadas · " + D.losses + " perdidas", ""],
  ["Día de la prueba", Math.min(28, Math.floor(D.days) + 1) + " de 28", D.runs.length + " corridas", ""],
].map(([a, b, c, k]) => `<div class="num"><small>${a}</small><strong class="${k}">${b}</strong><em>${c}</em></div>`).join("");

/* ---- valor en el tiempo: los dos perfiles con la misma escala ---- */
(function () {
  const W = 420, H = 170, L = 52, R = 10, T = 12, B = 26;
  const S = Object.entries(ALL.profiles).map(([k, d]) => ({k, xs: d.runs.map(p => new Date(p[0]).getTime()), ys: d.runs.map(p => p[1])})).filter(s => s.xs.length);
  const ax = [].concat(...S.map(s => s.xs)), ay = [].concat(...S.map(s => s.ys));
  if (ax.length < 2) { $("eq").innerHTML = ""; return; }
  const cap = D.capital0, x0 = Math.min(...ax), x1 = Math.max(...ax);
  let lo = Math.min(cap, ...ay), hi = Math.max(cap, ...ay);
  const pad = Math.max(1, (hi - lo) * 0.15); lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const X = t => L + (x1 === x0 ? 1 : (t - x0) / (x1 - x0)) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const ticks = [lo, cap, hi].filter((v, i, a) => a.indexOf(v) === i);
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--line")}" stroke-dasharray="${v === cap ? "0" : "2 3"}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">$${v.toLocaleString("es-MX")}</text>`).join("");
  S.sort((a, b) => (a.k === KEY) - (b.k === KEY)).forEach(s => {
    const c = css(PCOL[s.k]), me = s.k === KEY, pts = s.xs.map((x, i) => X(x).toFixed(1) + "," + Y(s.ys[i]).toFixed(1)).join(" ");
    const lx = X(s.xs[s.xs.length - 1]), ly = Y(s.ys[s.ys.length - 1]);
    if (me && s.xs.length > 1) g += `<polygon points="${X(s.xs[0])},${Y(lo)} ${pts} ${lx},${Y(lo)}" fill="${c}" fill-opacity=".12"/>`;
    g += (s.xs.length > 1 ? `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${me ? 2.2 : 1.4}" stroke-opacity="${me ? 1 : .7}" stroke-linejoin="round"/>` : "") + `<rect x="${lx - 3}" y="${ly - 3}" width="6" height="6" fill="${c}"/>`;
  });
  $("eq").innerHTML = g + `<text x="${L}" y="${H - 6}">${when(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${when(x1)}</text>`;
})();

/* ---- comparacion ---- */
(function () {
  const f = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
  const row = (k, d) => { const pl = d.equity - d.capital0, s = d.shadow;
    return `<tr><td><span class="dot" style="background:${css(PCOL[k])}"></span>${k === "base" ? "Base" : "Agresivo"}</td><td class="n">${money(d.equity)}</td><td class="n ${pl >= 0 ? "good" : "bad"}">${money(pl, true)}</td><td class="n">${d.n_closed}</td><td class="n">${d.wins} / ${d.losses}</td><td class="n">${s && s.n_t ? f(s.edge_t) + " pts" : "sin datos"}</td><td class="n">${Math.floor(d.days) + 1}</td></tr>`; };
  $("cmp").innerHTML = `<table class="cmp"><thead><tr><th>Perfil</th><th class="n">Valor</th><th class="n">Ganancia</th><th class="n">Cobradas</th><th class="n">Ganó / perdió</th><th class="n">Ventaja medida</th><th class="n">Día</th></tr></thead><tbody>` +
    Object.entries(ALL.profiles).map(([k, d]) => row(k, d)).join("") + "</tbody></table>";
})();

/* ---- ventaja: registro sombra ---- */
(function () {
  const s = D.shadow, W = 420, L = 14, R = 14, y = 44;
  if (!s || !s.n_t) { $("edge").innerHTML = ""; $("edgenote").textContent = "Aún no hay oportunidades resueltas en este perfil."; return; }
  const span = Math.max(2, Math.ceil(Math.max(Math.abs(s.lo_t), Math.abs(s.hi_t))));
  const X = v => L + (v + span) / (2 * span) * (W - L - R), cl = v => Math.max(-span, Math.min(span, v));
  const col = s.lo_t > 0 ? css("--good") : s.hi_t < 0 ? css("--bad") : css("--muted");
  let t = "";
  for (let v = -span; v <= span; v++) t += `<line x1="${X(v)}" x2="${X(v)}" y1="${y - 5}" y2="${y + 5}" stroke="${css("--line")}"/><text x="${X(v)}" y="${y + 24}" text-anchor="middle">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}</text>`;
  $("edge").innerHTML = `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${css("--line")}"/>` + t +
    `<line x1="${X(0)}" x2="${X(0)}" y1="${y - 26}" y2="${y + 8}" stroke="${css("--ink")}"/><text x="${X(0)}" y="12" text-anchor="middle">sin ventaja</text>` +
    `<line x1="${X(cl(s.lo_t))}" x2="${X(cl(s.hi_t))}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="6" stroke-opacity=".45"/>` +
    `<rect x="${X(cl(s.edge_t)) - 5}" y="${y - 5}" width="10" height="10" fill="${col}"/>` +
    `<text x="${W / 2}" y="${y + 44}" text-anchor="middle">puntos de ventaja por cada dólar apostado</text>`;
  const f = v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
  const verdict = s.lo_t > 0 ? "Por ahora sí: todo el rango está por encima de cero." : s.hi_t < 0 ? "Por ahora no: todo el rango está por debajo de cero." : "Todavía no se sabe: el rango cruza el cero.";
  $("edgenote").innerHTML = `Además de sus pocas órdenes, el cangrejo anota <b>todas</b> las oportunidades que ve. De ${s.n_t} ya resueltas que alguien pudo haberle vendido, perdieron ${s.losses_t} y la ventaja media es ${f(s.edge_t)} puntos (rango probable ${f(s.lo_t)} a ${f(s.hi_t)}). ${verdict}`;
})();

/* ---- tablas ---- */
(function () {
  const rows = D.positions.map(p => [p, "posición"]).concat(D.orders.map(o => [o, "orden"]));
  $("open").innerHTML = rows.length ? `<table><thead><tr><th>Mercado</th><th class="n">Precio</th><th class="n">Puesto</th></tr></thead><tbody>` +
    rows.map(([p, k]) => `<tr><td class="m">${esc(p.q)} <span class="pill">${k}</span></td><td class="n">${cents(p.px)}</td><td class="n">${money(p.cost)}</td></tr>`).join("") + "</tbody></table>"
    : '<p class="empty">Nada abierto en este momento.</p>';
  $("closed").innerHTML = D.closed.length ? `<table><thead><tr><th>Mercado</th><th class="n">Compró a</th><th class="n">Resultado</th></tr></thead><tbody>` +
    D.closed.map(c => `<tr><td class="m">${esc(c.q)} <span class="pill">${RULE[c.rule] || c.rule}</span></td><td class="n">${cents(c.px)}</td><td class="n ${c.pnl >= 0 ? "good" : "bad"}">${money(c.pnl, true)}</td></tr>`).join("") + "</tbody></table>"
    : '<p class="empty">Todavía no ha cobrado ninguna.</p>';
  $("foot").textContent = "Simulación en papel (empezó el " + when(D.started) + "). No hay cuentas, llaves ni órdenes reales: solo se leen los precios públicos de Polymarket. Una orden cuenta como llenada si el precio bajó hasta ella y además gana un sorteo del 30%. Se actualiza cada hora." + (D.halted ? " Este perfil está detenido porque llegó a su límite de pérdida." : "");
})();

}

/* ---- el cangrejo ---- */
const OPEN = ["C.C..............C.C", "C.C..............C.C", "CCC...E.....EEE..CCC", ".C....C.....EEE...C.", ".CC..CCEEEEEECC..CC.", "..CCCCCCCCCCCCCCCC..", "....CCCCCCCCCCCC....", "....CCCCCCCCCCCC...."];
const SHUT = [".C................C.", ".C................C.", ".CC...E.....EEE..CC.", ".C....C.....EEE...C.", ".CC..CCEEEEEECC..CC.", "..CCCCCCCCCCCCCCCC..", "....CCCCCCCCCCCC....", "....CCCCCCCCCCCC...."];
const LEGS = [["...C.CCCCCCCCCC.C...", "..C..C.C....C.C..C..", "..C..C.C....C.C..C..", ".....C........C....."],
              ["...C.CCCCCCCCCC.C...", "..C.C..C....C..C.C..", ".C..C..C....C..C..C.", "....C..........C...."]];
const cv = $("crab"), cx = cv.getContext("2d");
function draw(claw, leg) {
  const rows = (claw ? OPEN : SHUT).concat(LEGS[leg]), c = css("--me"), e = css("--ink");
  cx.clearRect(0, 0, 20, 12);
  rows.forEach((r, y) => { for (let x = 0; x < 20; x++) { const ch = r[x]; if (ch === "C" || ch === "E") { cx.fillStyle = ch === "E" ? e : c; cx.fillRect(x, y, 1, 1); } } });
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let tick = 0, walking = 0, snap = 0;
draw(1, 0);
if (!still) setInterval(() => { tick++; if (walking > 0) walking--; if (snap > 0) snap--; draw(snap > 0 ? snap % 2 : (tick % 12 < 10 ? 1 : 0), walking > 0 ? tick % 2 : 0); }, 140);

const SPOT = {order: 0, expire: 0, touched_not_filled: 0, fill: 1, settle: 2, halt: 1};
const LEFT = ["16.66%", "50%", "83.33%"];
function describe(e) {
  if (e.ev === "order") return "Pone una orden de compra a " + cents(e.px);
  if (e.ev === "fill") return "Le llenan la orden: compra a " + cents(e.px);
  if (e.ev === "settle") return e.result >= 1 ? "Cobra $1 por acción: gana " + money(e.pnl) : "El mercado salió en contra: pierde " + money(Math.abs(e.pnl));
  if (e.ev === "touched_not_filled") return "El precio tocó su orden, pero no le tocó turno";
  if (e.ev === "expire") return "La orden caduca sin que nadie le venda";
  if (e.ev === "halt") return "Se detiene: la pérdida llegó al 15%";
  return e.ev;
}
let i = 0, paused = still, timer = null;
function show() {
  if (!D.events.length) { $("what").textContent = "El cangrejo todavía no ha hecho nada."; $("q").textContent = ""; $("when").textContent = ""; return; }
  const e = D.events[i], s = SPOT[e.ev] ?? 1;
  cv.style.left = LEFT[s]; walking = 8; snap = 16;
  [0, 1, 2].forEach(k => $("st" + k).classList.toggle("on", k === s));
  $("what").textContent = describe(e); $("q").textContent = e.q || ""; $("when").textContent = when(e.t);
  if (e.ev === "settle" && !still) {
    const p = document.createElement("div"); p.className = "pop " + (e.pnl >= 0 ? "good" : "bad"); p.textContent = money(e.pnl, true); p.style.left = LEFT[2];
    document.querySelector(".floor").appendChild(p); setTimeout(() => p.remove(), 1700);
  }
}
